# Updates only readme.txt and the listing images (.wordpress-org/) on WordPress.org,
# without a new release. Runs on pushes to main that change those files.
name: Update WordPress.org readme and assets

on:
  push:
    branches:
      - main
    paths:
      - "readme.txt"
      - ".wordpress-org/**"
  workflow_dispatch:

jobs:
  update:
    name: Update readme and assets
    runs-on: ubuntu-latest
    # Does nothing until the repository variable WPORG_APPROVED is set to "true".
    if: vars.WPORG_APPROVED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Update readme and assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: shihabiiuc-post-grid
